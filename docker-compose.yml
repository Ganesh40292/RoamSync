version: '3.8'

services:
  database:
    build:
      context: .
      dockerfile: docker/database.Dockerfile
    container_name: tripsyncai-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tripsyncai}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Ganesh}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripsyncai-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/${DB_NAME:-tripsyncai}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Ganesh}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: tripsyncai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
