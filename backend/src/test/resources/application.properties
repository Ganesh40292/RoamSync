# H2 in-memory test database with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during unit/slice tests where H2 create-drop handles the schema
spring.flyway.enabled=false

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970
jwt.expiration=86400000

gemini.api.key=test_key
gemini.api.model=gemini-2.0-flash
